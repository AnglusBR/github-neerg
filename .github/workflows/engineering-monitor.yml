name: Real Engineering Monitor

on:
  schedule:
    - cron: "12 7 * * *"
      timezone: "America/Sao_Paulo"
    - cron: "37 10 * * *"
      timezone: "America/Sao_Paulo"
    - cron: "18 14 * * *"
      timezone: "America/Sao_Paulo"
    - cron: "49 17 * * *"
      timezone: "America/Sao_Paulo"
    - cron: "23 21 * * *"
      timezone: "America/Sao_Paulo"
    - cron: "45 22 * * 0"
      timezone: "America/Sao_Paulo"
  workflow_dispatch:
    inputs:
      period:
        description: Período do relatório
        type: choice
        options:
          - daily
          - weekly
        default: daily

permissions:
  contents: write
  models: read

concurrency:
  group: real-engineering-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Select report period
        id: period
        env:
          MANUAL_PERIOD: ${{ inputs.period }}
          CURRENT_SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          if [ -n "$MANUAL_PERIOD" ]; then
            PERIOD="$MANUAL_PERIOD"
          elif [ "$CURRENT_SCHEDULE" = "45 22 * * 0" ]; then
            PERIOD="weekly"
          else
            PERIOD="daily"
          fi
          echo "value=$PERIOD" >> "$GITHUB_OUTPUT"

      - name: Collect real activity and generate report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m github_neerg.cli \
            --username AnglusBR \
            --period "${{ steps.period.outputs.value }}" \
            --output . \
            --ai-token "$GITHUB_TOKEN"

      - name: Commit changed reports as GitHub Actions bot
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- data reports; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nenhum dado novo; nada será enviado."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          git commit -m "report: update verified GitHub activity"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Real Engineering Monitor"
            echo
            echo "- Período: \`${{ steps.period.outputs.value }}\`"
            echo "- Relatório alterado: \`${{ steps.commit.outputs.changed || 'false' }}\`"
            echo "- Resultado: \`${{ job.status }}\`"
            echo "- Execução: \`#${{ github.run_number }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

