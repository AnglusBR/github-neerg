
name: Green Contributions

on:
  schedule:
    # Horários naturais de segunda a sexta
    - cron: '18 9 * * 1-5'
      timezone: "America/Sao_Paulo"

    - cron: '43 11 * * 1-5'
      timezone: "America/Sao_Paulo"

    - cron: '17 15 * * 1-5'
      timezone: "America/Sao_Paulo"

    - cron: '36 17 * * 1-5'
      timezone: "America/Sao_Paulo"

    # Sábado: atividade ocasional
    - cron: '24 11 * * 6'
      timezone: "America/Sao_Paulo"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: green-contributions
  cancel-in-progress: false

jobs:
  contribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "anglus-software"
          git config user.email "77460329+michel-anglus@users.noreply.github.com"

      - name: Generate Natural Activity
        id: generate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          DAY=$(TZ=America/Sao_Paulo date +%u)
          CHANCE=$((RANDOM % 100))

          # Execuções automáticas podem descansar.
          # Execução manual sempre produz atividade.
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then

            if [ "$DAY" -eq 6 ]; then
              # Sábado: 70% de chance de descansar
              if [ "$CHANCE" -lt 70 ]; then
                echo "Sábado de descanso."
                echo "commits=0" >> "$GITHUB_OUTPUT"
                exit 0
              fi

            elif [ "$DAY" -eq 7 ]; then
              echo "Domingo de descanso."
              echo "commits=0" >> "$GITHUB_OUTPUT"
              exit 0

            else
              # Dias úteis: 35% de chance de descansar
              if [ "$CHANCE" -lt 35 ]; then
                echo "Nenhuma atividade nesta execução."
                echo "commits=0" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi

          # Normalmente 1 commit por execução.
          COMMITS=1

          # Em alguns dias úteis, produz 2 commits.
          if [ "$DAY" -le 5 ]; then
            if [ $((RANDOM % 100)) -lt 15 ]; then
              COMMITS=2
            fi
          fi

          git pull --rebase --autostash origin "$BRANCH"

          mkdir -p .activity

          FILE=".activity/activity-$(TZ=America/Sao_Paulo date +%Y-%m-%d).txt"

          MESSAGES=(
            "chore: update daily log"
            "chore: refresh activity records"
            "docs: update activity notes"
            "chore: sync progress log"
            "docs: record daily progress"
          )

          echo "Generating $COMMITS commits..."

          for ((i=1; i<=COMMITS; i++)); do

            MSG=${MESSAGES[$RANDOM % ${#MESSAGES[@]}]}

            TIMESTAMP=$(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M:%S')

            echo "$TIMESTAMP | run $GITHUB_RUN_NUMBER | update $i" >> "$FILE"

            git add "$FILE"
            git commit -m "$MSG" --quiet

          done

          echo "commits=$COMMITS" >> "$GITHUB_OUTPUT"
          echo "day=$DAY" >> "$GITHUB_OUTPUT"

      - name: Push Changes
        if: steps.generate.outputs.commits != '0'
        run: |
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Notify Google Chat
        if: success() && steps.generate.outputs.commits != '0'
        env:
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          COMMITS: ${{ steps.generate.outputs.commits }}
          DAY: ${{ steps.generate.outputs.day }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$GOOGLE_CHAT_WEBHOOK_URL" ]; then
            echo "Google Chat não configurado."
            exit 0
          fi

          python3 - <<'PY' > /tmp/google-chat-message.json
          import json
          import os

          message = f"""✅ Green Contributions

          Repositório: {os.environ['REPO']}
          Branch: {os.environ['BRANCH']}
          Commits: {os.environ['COMMITS']}
          Dia: {os.environ['DAY']}
          Execução: #{os.environ['RUN_NUMBER']}
          Link: {os.environ['RUN_URL']}"""

          print(json.dumps({"text": message}, ensure_ascii=False))
          PY

          curl -fsS \
            -X POST \
            -H "Content-Type: application/json; charset=UTF-8" \
            --data @/tmp/google-chat-message.json \
            "$GOOGLE_CHAT_WEBHOOK_URL"
